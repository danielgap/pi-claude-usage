# Publish @danielgap/pi-claude-usage to npm and create the GitHub
# Release from a version tag.
#
# Triggers:
#   - push of a v* tag (the normal release path)
#   - workflow_dispatch with a tag input (retry after adding NPM_TOKEN, or a
#     release whose first tag push failed for publication-only reasons)
#
# Guards (mirrors the Gentle release discipline):
#   - the tag must be annotated and match package.json's version
#   - the tagged commit must be an ancestor of origin/main, so the workflow
#     definition and the release commit always come from main
#   - tests and typecheck must pass before anything is published
#
# Required secret: NPM_TOKEN (automation or granular token with publish
# rights for @danielgap/pi-claude-usage) at Settings → Secrets and
# variables → Actions.

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact existing version tag to publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the peeled tag commit and verify it is on main
        run: |
          set -euo pipefail
          tag="${TAG}"
          case "${tag}" in v[0-9]*) ;; *) echo "tag '${tag}' is not a vX.Y.Z tag" >&2; exit 1 ;; esac

          remote="${REPO_URL}"
          sha="$(git ls-remote --tags "${remote}" "refs/tags/${tag}^{}" | cut -f1)"
          if [ -z "${sha}" ]; then
            echo "tag '${tag}' does not exist on the remote in annotated form" >&2; exit 1
          fi
          echo "SHA=${sha}" >> "$GITHUB_ENV"

          # The release commit must be reachable from main.
          git init -q verify-main
          cd verify-main
          git remote add origin "${remote}"
          git fetch -q --no-tags origin main "refs/tags/${tag}:refs/tags/${tag}"
          git merge-base --is-ancestor "${sha}" origin/main

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Verify the tag matches package.json's version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${TAG}" \
            || { echo "tag ${TAG} does not match package.json version ${version}" >&2; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          # Derive the npm package name from the manifest so the workflow never
          # hardcodes it in more than one place.
          echo "PKG_NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Package (dry run)
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}"; then
            echo "release ${TAG} already exists; leaving it untouched"
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --target "${SHA}" \
              --title "${PKG_NAME} ${TAG}" \
              --generate-notes
          fi

      - name: Verify npm
        run: |
          set -euo pipefail
          # npm accepts a publish before the new version is queryable: a fresh
          # version can take a few minutes to appear in the registry. Retry
          # for up to ~3 minutes instead of racing propagation.
          attempt=1
          until [ "$(npm view "${PKG_NAME}@${VERSION}" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)" = "${VERSION}" ]; do
            if [ "${attempt}" -gt 18 ]; then
              echo "::error::${PKG_NAME}@${VERSION} did not appear in the npm registry within 3 minutes of publishing"
              exit 1
            fi
            echo "attempt ${attempt}/18: registry does not serve ${PKG_NAME}@${VERSION} yet; retrying in 10s"
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "registry serves ${PKG_NAME}@${VERSION} (attempt ${attempt})"
          npm dist-tag ls "${PKG_NAME}" --registry=https://registry.npmjs.org/
